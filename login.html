<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta
        name="description"
        content="Acceso privado al panel de administración de DIVARVARO Inmobiliaria para gestionar propiedades, hero y multimedia."
    >
    <title>Acceso administrador | DIVARVARO Inmobiliaria</title>
    <link rel="stylesheet" href="admin.css">
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    >
</head>

<body class="login-body">
    <main class="login-main">
        <section class="login-card">
            <a href="index.html" class="login-back">
                <i class="fa-solid fa-arrow-left"></i>
                Volver a la landing
            </a>

            <div class="login-brand">
                <p>Panel privado</p>
                <h1>DIVARVARO</h1>
                <span>Ingresá para administrar propiedades, hero e imágenes del sitio.</span>
            </div>

            <form id="login-form" class="admin-form login-form" aria-describedby="login-mensaje">
                <label>
                    Email
                    <input type="email" id="login-email" placeholder="admin@email.com" autocomplete="email" required>
                </label>

                <label>
                    Contraseña
                    <input type="password" id="login-password" placeholder="••••••••" autocomplete="current-password" required>
                </label>

                <button type="submit" id="login-submit" class="admin-boton login-submit" aria-label="Ingresar al panel administrador">
                    <i class="fa-solid fa-right-to-bracket"></i>
                    Ingresar
                </button>
            </form>

            <p id="login-mensaje" class="mensaje-admin login-message" aria-live="polite"></p>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config/supabaseConfig.js"></script>
    <script src="services/loggerService.js"></script>
    <script src="services/supabaseClient.js"></script>
    <script src="services/authService.js"></script>
    <script src="login.js"></script>
</body>

</html>
